# Flent Secured v2 - Supabase Local Development Configuration
# Reference: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = false

[auth.sms.twilio]
enabled = false
# Required fields (even when disabled)
account_sid = "PLACEHOLDER_NOT_USED"
message_service_sid = "PLACEHOLDER_NOT_USED"
auth_token = "env(TWILIO_AUTH_TOKEN)"

[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false

[analytics]
enabled = false
port = 54327
vector_port = 54328

[functions]
# All functions handle auth internally via getUser() — gateway JWT verification
# is disabled because Supabase now issues ES256 user JWTs which the gateway's
# HS256 verify_jwt check rejects. Each function validates auth in its own code.

[functions.payment-webhook]
verify_jwt = false

[functions.initiate-payment]
verify_jwt = false

[functions.verify-bank]
verify_jwt = false

[functions.verify-identity]
verify_jwt = false

[functions.auth-otp]
verify_jwt = false

[functions.upload-document]
verify_jwt = false

[functions.process-document]
verify_jwt = false

[functions.confirm-extraction]
verify_jwt = false

[functions.verify-utility]
verify_jwt = false

[functions.claim-invite-code]
verify_jwt = false

[functions.get-waitlist-status]
verify_jwt = false

[functions.dashboard-data]
verify_jwt = false

[functions.update-profile]
verify_jwt = false

[functions.calculate-cashback]
verify_jwt = false

[functions.get-payment-history]
verify_jwt = false

[functions.send-landlord-invite]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.generate-receipt]
verify_jwt = false

[functions.send-push-notification]
verify_jwt = false

[functions.send-whatsapp]
verify_jwt = false

[functions.send-sms]
verify_jwt = false

[functions.landlord-approve]
verify_jwt = false

[functions.delete-auth-user]
verify_jwt = false

[functions.seed-test-data]
verify_jwt = false

[edge_runtime]
policy = "oneshot"
inspector_port = 8083

[experimental]
# Enables pg_cron extension
orioledb_version = ""
s3_host = ""
s3_region = ""
s3_access_key = ""
s3_secret_key = ""

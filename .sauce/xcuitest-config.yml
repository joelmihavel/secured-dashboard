# =============================================================================
# Flent Secured v2 - Sauce Labs XCUITest Configuration
# =============================================================================
# Reference: https://docs.saucelabs.com/mobile-apps/automated-testing/espresso-xcuitest/xcuitest/
# =============================================================================

apiVersion: v1alpha
kind: xcuitest
sauce:
  region: us-west-1
  concurrency: 3
  metadata:
    tags:
      - flent-secured
      - ios
      - visual-testing
    build: ${CI_BUILD_ID:-local}

# =============================================================================
# XCUITest Settings
# =============================================================================
xcuitest:
  app: storage:FlentSecured.app.zip
  testApp: storage:FlentSecuredUITests-Runner.app.zip

# =============================================================================
# Test Suites
# =============================================================================
suites:
  # ---------------------------------------------------------------------------
  # Visual Regression Suite (iPhone 15 Pro)
  # ---------------------------------------------------------------------------
  - name: visual-regression-ios
    testOptions:
      class:
        - FlentSecuredUITests.VisualRegressionTests
    devices:
      - name: "iPhone 15 Pro Simulator"
        platformVersion: "17.2"
        orientation: portrait
    env:
      TEST_MODE: "visual"
      SAUCE_VISUAL: "true"

  # ---------------------------------------------------------------------------
  # Full UI Test Suite (Multiple Devices)
  # ---------------------------------------------------------------------------
  - name: full-ui-tests
    testOptions:
      class:
        - FlentSecuredUITests.AuthFlowTests
        - FlentSecuredUITests.PaymentFlowTests
        - FlentSecuredUITests.ProfileTests
    devices:
      - name: "iPhone 15 Pro Simulator"
        platformVersion: "17.2"
        orientation: portrait
      - name: "iPhone 14 Simulator"
        platformVersion: "16.4"
        orientation: portrait
      - name: "iPhone SE (3rd generation) Simulator"
        platformVersion: "17.2"
        orientation: portrait
    env:
      TEST_PHONE: "9999999999"
      TEST_OTP: "000000"

  # ---------------------------------------------------------------------------
  # Accessibility Tests
  # ---------------------------------------------------------------------------
  - name: accessibility-tests
    testOptions:
      class:
        - FlentSecuredUITests.AccessibilityTests
    devices:
      - name: "iPhone 15 Pro Simulator"
        platformVersion: "17.2"
        orientation: portrait
    env:
      ACCESSIBILITY_MODE: "true"

  # ---------------------------------------------------------------------------
  # Payment Flow Tests (Critical Path)
  # ---------------------------------------------------------------------------
  - name: payment-critical-path
    testOptions:
      class:
        - FlentSecuredUITests.PaymentFlowTests/testPaymentInitiation
        - FlentSecuredUITests.PaymentFlowTests/testPaymentSuccess
        - FlentSecuredUITests.PaymentFlowTests/testPaymentFailure
        - FlentSecuredUITests.PaymentFlowTests/testCashbackApplication
    devices:
      - name: "iPhone 15 Pro Simulator"
        platformVersion: "17.2"
        orientation: portrait
    env:
      TEST_MODE: "payment"
      # Use sandbox PayU
      PAYU_BASE_URL: "https://sandboxsecure.payu.in"

# =============================================================================
# Artifacts
# =============================================================================
artifacts:
  download:
    when: always
    match:
      - "*.xml"
      - "*.json"
      - "*.png"
    directory: ./test-results/sauce-labs/

# =============================================================================
# Reporters
# =============================================================================
reporters:
  junit:
    enabled: true
  json:
    enabled: true
    webhookURL: ""

# =============================================================================
# Flent Secured v2 - Frontend CI Pipeline (TE-123)
# =============================================================================
# Triggers: Push to main and PRs to main affecting React Native app code
# Jobs:
#   1. lint-typecheck  - ESLint + TypeScript (fast feedback, single Node version)
#   2. test            - Jest with coverage (matrix: Node 20 + 22)
#   3. coverage-report - Post coverage summary as PR comment
#
# IMPORTANT: This pipeline runs checks only. Merging is always manual.
# =============================================================================

name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'rn-app/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rn-app/**'
      - '.github/workflows/ci-frontend.yml'

# Cancel in-progress runs for the same branch/PR to save runner minutes
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: Static Analysis (Lint + Type-check)
  # ===========================================================================
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rn-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rn-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ app/ --ext .ts,.tsx --max-warnings 0

      - name: Run TypeScript type-check
        run: npx tsc --noEmit

  # ===========================================================================
  # Job 2: Jest Tests with Coverage (matrix strategy)
  # ===========================================================================
  test:
    name: Jest Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: rn-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: rn-app/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: rn-app/node_modules
          key: node-modules-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('rn-app/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run Jest tests with coverage
        run: npx jest --coverage --ci --forceExit
        env:
          CI: true

      - name: Upload coverage artifact
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: rn-app/coverage/
          retention-days: 14

      - name: Upload to Codecov
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          directory: rn-app/coverage
          flags: frontend
          fail_ci_if_error: false
        continue-on-error: true

      - name: Generate coverage summary
        if: matrix.node-version == 20
        id: coverage-summary
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.lines.pct)")
            BRANCHES=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.branches.pct)")
            FUNCTIONS=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.functions.pct)")
            STATEMENTS=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.statements.pct)")

            echo "lines=$LINES" >> $GITHUB_OUTPUT
            echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
            echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
            echo "statements=$STATEMENTS" >> $GITHUB_OUTPUT
            echo "has_coverage=true" >> $GITHUB_OUTPUT

            # Write job summary
            echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric     | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|------------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lines      | ${LINES}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches   | ${BRANCHES}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions  | ${FUNCTIONS}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${STATEMENTS}% |" >> $GITHUB_STEP_SUMMARY
          else
            echo "has_coverage=false" >> $GITHUB_OUTPUT
            echo "::warning::coverage-summary.json not found"
          fi

  # ===========================================================================
  # Job 3: Post Coverage Comment on PR
  # ===========================================================================
  coverage-report:
    name: Coverage PR Comment
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    defaults:
      run:
        working-directory: rn-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: rn-app/coverage

      - name: Post coverage comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'rn-app/coverage/coverage-summary.json';

            if (!fs.existsSync(path)) {
              console.log('No coverage summary found, skipping comment.');
              return;
            }

            const coverage = JSON.parse(fs.readFileSync(path, 'utf8'));
            const total = coverage.total;

            const badge = (pct) => {
              if (pct >= 80) return '++';
              if (pct >= 50) return '+-';
              return '--';
            };

            const body = [
              '## Frontend Test Coverage Report',
              '',
              '| Metric | Coverage | Threshold | Status |',
              '|--------|----------|-----------|--------|',
              `| Lines | ${total.lines.pct}% | 50% | ${total.lines.pct >= 50 ? 'Pass' : 'FAIL'} |`,
              `| Branches | ${total.branches.pct}% | 50% | ${total.branches.pct >= 50 ? 'Pass' : 'FAIL'} |`,
              `| Functions | ${total.functions.pct}% | 50% | ${total.functions.pct >= 50 ? 'Pass' : 'FAIL'} |`,
              `| Statements | ${total.statements.pct}% | 50% | ${total.statements.pct >= 50 ? 'Pass' : 'FAIL'} |`,
              '',
              `> Coverage thresholds are configured in \`rn-app/jest.config.js\``,
              `> Full report available as workflow artifact.`,
              '',
              `_Generated by [Frontend CI](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})_`
            ].join('\n');

            // Find existing coverage comment to update (avoid spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## Frontend Test Coverage Report';
            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
              console.log('Updated existing coverage comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
              console.log('Created new coverage comment.');
            }

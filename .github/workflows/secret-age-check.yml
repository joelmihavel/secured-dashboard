# Secret age check — weekly cron.
#
# Per the cleanup plan (Phase 5 Day 11), this surfaces stale tokens before
# they break in prod. Currently a stub — a full implementation would check
# Supabase / EAS / GCP secret creation dates via their respective APIs.
#
# For now: just a calendar reminder via GH issue.

name: secret-age-check

on:
  schedule:
    - cron: "0 9 * * MON"   # Mondays 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Secret age check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reminder issue (idempotent — quarterly cadence)
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const quarter = `Q${Math.ceil((now.getMonth() + 1) / 3)}-${now.getFullYear()}`;
            const title = `Secret rotation reminder — ${quarter}`;

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });

            if (existing.data.total_count > 0) {
              console.log(`Quarterly reminder already open: ${existing.data.items[0].html_url}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['ops', 'secret-rotation'],
              body: [
                `Quarterly secret rotation reminder for ${quarter}.`,
                ``,
                `Rotate the following:`,
                ``,
                `- [ ] SUPABASE_ACCESS_TOKEN (90-day cadence per cleanup plan)`,
                `- [ ] EXPO_TOKEN`,
                `- [ ] CASHFREE_PG_APP_SECRET (if 12 months old)`,
                `- [ ] CASHFREE_SPLIT_WEBHOOK_SECRET (Phase 7e — verify it's separate from PG secret)`,
                `- [ ] CASHFREE_VENDOR_WEBHOOK_SECRET (same)`,
                `- [ ] TWILIO_AUTH_TOKEN`,
                `- [ ] GEMINI_API_KEY`,
                `- [ ] EXTRACTION_SECRET (Cloud Run + Supabase secrets must match)`,
                ``,
                `Procedure:`,
                `1. Generate new value (e.g., \`openssl rand -hex 32\`)`,
                `2. Set on the appropriate surface (EAS dashboard / supabase secrets / gcloud)`,
                `3. Smoke test`,
                `4. Revoke old value at the source (Supabase project tokens, EAS dashboard, etc.)`,
                ``,
                `Close once all rotated.`,
              ].join('\n'),
            });

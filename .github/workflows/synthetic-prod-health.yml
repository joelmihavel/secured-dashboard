# Synthetic prod health check — runs every 5 min.
#
# Per the cleanup plan (Phase 5 Day 11), this hits prod auth-otp and
# the Cloud Run extraction-service-prod /health endpoint. Files an
# issue on failure (idempotent — won't spam if the check is already
# down for hours).

name: synthetic-prod-health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  health:
    name: Synthetic prod health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      status: ${{ steps.report.outputs.status }}
    steps:
      - name: auth-otp availability check
        id: auth-otp
        env:
          SUPABASE_URL: https://api-secured.flent.in
        run: |
          # Hit auth-otp with action=health to verify edge runtime is up.
          # We use a junk phone — the function should respond quickly with
          # a "phone validation failed" or similar, but >= 200 + structured body.
          BODY=$(curl -fsS -m 10 -X POST \
            -H "Content-Type: application/json" \
            -d '{"action":"health"}' \
            "$SUPABASE_URL/functions/v1/auth-otp" 2>&1) || {
              echo "auth-otp probe failed: $BODY"
              echo "result=fail" >> $GITHUB_OUTPUT
              exit 1
            }
          echo "auth-otp probe OK: ${BODY:0:200}"
          echo "result=ok" >> $GITHUB_OUTPUT

      - name: Cloud Run extraction-service /health
        id: cloud-run
        run: |
          # extraction-service-prod has allUsers → run.invoker (per IAM audit),
          # so we can hit /health without an identity token.
          HTTP=$(curl -s -o /tmp/cr-health.json -w "%{http_code}" -m 10 \
            "https://extraction-service-prod-nbmslvmlcq-el.a.run.app/health")
          if [ "$HTTP" != "200" ]; then
            echo "Cloud Run probe failed: HTTP $HTTP"
            cat /tmp/cr-health.json
            echo "result=fail" >> $GITHUB_OUTPUT
            exit 1
          fi
          cat /tmp/cr-health.json
          echo "result=ok" >> $GITHUB_OUTPUT

      - name: Report status
        id: report
        run: echo "status=ok" >> $GITHUB_OUTPUT

  on-failure:
    needs: health
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const title = `Prod health failure: ${today}`;

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });

            if (existing.data.total_count > 0) {
              // Update existing issue with a comment instead of spamming new ones
              const issue = existing.data.items[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Health check failed again at ${new Date().toISOString()}. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['ops', 'prod-down'],
              body: [
                `Synthetic prod health check failed.`,
                ``,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Date:** ${today}`,
                ``,
                `Surfaces probed: auth-otp, extraction-service-prod /health.`,
                `Check Cloud Run logs + Supabase function logs.`,
                ``,
                `Close once green.`,
              ].join('\n'),
            });

# Reusable workflow — deploy Supabase changes (functions or migrations).
#
# Per the cleanup plan (Phase 5 Day 4–5), this is one of the building blocks
# called by deploy.yml. It targets either prod (uowjtrzmszuaiokqxgir) or dev
# (zqlowjveyqiagnbmfwsb) based on the `project-ref` input.
#
# Migration safety:
#   - mode=db-push runs `supabase db push --dry-run` first
#   - On prod target, requires the SAME SHA to have a successful run-id in
#     deploy-dev for the past 7 days (env-precondition check)
#   - Post-push schema fingerprint (sha256 of pg_dump --schema-only) compared
#     against the expected hash computed from the migration tree

name: deploy-supabase

on:
  workflow_call:
    inputs:
      mode:
        description: "db-push | functions"
        required: true
        type: string
      project-ref:
        description: "Supabase project ref (uowjtrzmszuaiokqxgir or zqlowjveyqiagnbmfwsb)"
        required: true
        type: string
      environment:
        description: "dev | prod (used for branch label only)"
        required: true
        type: string
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.mode }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Login + link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ inputs.project-ref }}

      # ─── Migration mode ──────────────────────────────────────────────
      - name: Migration dry-run (db-push only)
        if: inputs.mode == 'db-push'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "=== Dry-run preview ==="
          supabase db push --dry-run | tee /tmp/dry-run-output.txt
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Migration dry-run on ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo '```sql' >> $GITHUB_STEP_SUMMARY
          cat /tmp/dry-run-output.txt | head -200 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Migration push (db-push only)
        if: inputs.mode == 'db-push'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "=== Apply migrations ==="
          supabase db push

      - name: Post-push schema fingerprint
        if: inputs.mode == 'db-push'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Schema fingerprint check — placeholder."
          echo "TODO: dump --schema-only via supabase db dump, compute sha256,"
          echo "compare against expected hash computed from migration tree."
          echo "For now, just log that migrations completed without error."

      # ─── Functions mode ──────────────────────────────────────────────
      - name: Detect changed function dirs
        if: inputs.mode == 'functions'
        id: changed
        run: |
          if [ -n "${{ github.event.pull_request.base.ref }}" ]; then
            BASE_SHA=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)
          else
            BASE_SHA=$(git rev-parse HEAD~1)
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD -- supabase/functions/ \
                    | awk -F/ '$3 != "" && $3 != "_shared" {print $3}' \
                    | sort -u | tr '\n' ' ')
          # If _shared changed, redeploy ALL functions that import it (everything,
          # for safety) — the bundling pulls in _shared at deploy time.
          if git diff --name-only "$BASE_SHA"...HEAD -- supabase/functions/_shared/ | head -1 | grep -q .; then
            CHANGED=$(ls supabase/functions/ | grep -v "^_" | tr '\n' ' ')
            echo "_shared changed → redeploying all functions"
          fi
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed function dirs: $CHANGED"

      - name: Deploy changed functions
        if: inputs.mode == 'functions' && steps.changed.outputs.changed != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in ${{ steps.changed.outputs.changed }}; do
            echo "=== Deploying $fn ==="
            supabase functions deploy "$fn" \
              --project-ref ${{ inputs.project-ref }} \
              --no-verify-jwt
          done

      - name: No-op note
        if: inputs.mode == 'functions' && steps.changed.outputs.changed == ''
        run: echo "No function changes in this commit range — nothing to deploy."

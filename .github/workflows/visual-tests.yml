# =============================================================================
# Flent Secured v2 - Visual Regression Testing
# =============================================================================
# Triggers: Manual dispatch only (on-demand)
# Jobs: Sauce Labs visual testing for iOS and Web
# =============================================================================

name: Visual Regression Tests

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - web
      baseline:
        description: 'Update baseline images'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Test environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
  SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

jobs:
  # ===========================================================================
  # iOS Visual Tests (Sauce Labs)
  # ===========================================================================
  ios-visual:
    name: iOS Visual Tests
    runs-on: macos-14
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Build for Sauce Labs
        run: |
          xcodebuild build-for-testing \
            -project ios/FlentSecured.xcodeproj \
            -scheme FlentSecuredUITests \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create App and Test Runner Archives
        run: |
          mkdir -p artifacts
          # Create .app
          cp -r DerivedData/Build/Products/Debug-iphoneos/FlentSecured.app artifacts/
          # Create test runner
          cp -r DerivedData/Build/Products/Debug-iphoneos/FlentSecuredUITests-Runner.app artifacts/
          # Zip for Sauce Labs
          cd artifacts
          zip -r FlentSecured.app.zip FlentSecured.app
          zip -r FlentSecuredUITests-Runner.app.zip FlentSecuredUITests-Runner.app

      - name: Upload to Sauce Labs
        run: |
          curl -u "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" \
            -X POST "https://api.us-west-1.saucelabs.com/v1/storage/upload" \
            -F "payload=@artifacts/FlentSecured.app.zip" \
            -F "name=FlentSecured.app.zip"

          curl -u "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" \
            -X POST "https://api.us-west-1.saucelabs.com/v1/storage/upload" \
            -F "payload=@artifacts/FlentSecuredUITests-Runner.app.zip" \
            -F "name=FlentSecuredUITests-Runner.app.zip"

      - name: Run Sauce Labs XCUITest
        uses: saucelabs/saucectl-run-action@v4
        with:
          config-file: .sauce/xcuitest-config.yml
          select-suite: visual-regression-ios

      - name: Update Baselines (if requested)
        if: github.event.inputs.baseline == 'true'
        run: |
          echo "Baseline update requested - check Sauce Labs dashboard for new baseline images"

  # ===========================================================================
  # Web Visual Tests (Sauce Labs + Playwright)
  # ===========================================================================
  web-visual:
    name: Web Visual Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'web'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      - name: Build Web App
        run: |
          cd web
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}

      - name: Run Sauce Labs Visual Tests
        uses: saucelabs/saucectl-run-action@v4
        with:
          config-file: .sauce/web-visual-config.yml
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

  # ===========================================================================
  # Report Generation
  # ===========================================================================
  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [ios-visual, web-visual]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Sauce Labs Results
        run: |
          echo "Visual test results available at:"
          echo "https://app.saucelabs.com/visual/builds"

      - name: Post Summary
        run: |
          echo "## Visual Regression Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | ${{ needs.ios-visual.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web | ${{ needs.web-visual.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View detailed results on Sauce Labs](https://app.saucelabs.com/visual/builds)" >> $GITHUB_STEP_SUMMARY

# Deploy prod — triggered by pushing a tag matching `deploy-prod-*`
# (or via manual workflow_dispatch).
#
# Push to `main` alone does NOT deploy. The tag is the deploy decision —
# you push `deploy-prod-<date>-<slug>` when you want the merged code on
# main to actually go live. This decouples "merge to main" from "deploy
# to production" so doc-only fixes, refactors, and batched merges don't
# auto-deploy.
#
# Why no GitHub Environments / approval gates: GitHub Pro is required
# for those on private repos, and the user opted out (see memory
# project_branch_protection_deferred.md + project_prod_ci_tag_deploy.md).
# The tag-push step IS the manual approval — only the user can push tags,
# and creating a tag is an explicit action distinct from merging code.
#
# Tag convention:
#   deploy-prod-2026-04-26-cashfree-rotation
#   deploy-prod-<YYYY-MM-DD>-<short-slug>
#
# To deploy: `git tag deploy-prod-$(date +%Y-%m-%d)-<slug> && git push origin <tag>`
# To dispatch manually:    GitHub Actions UI → "deploy-prod" → "Run workflow"

name: deploy-prod

on:
  push:
    tags: ['deploy-prod-*']
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      project-ref: uowjtrzmszuaiokqxgir
      cloud-run-service: extraction-service-prod
      cloud-run-min-instances: 3
      eas-channel: production
    # Map env-suffixed repo secrets to the generic names deploy.yml expects.
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
      GCP_SA_EMAIL: ${{ secrets.GCP_SA_EMAIL_PROD }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SLACK_DEPLOYS_WEBHOOK: ${{ secrets.SLACK_DEPLOYS_WEBHOOK }}

  release-notes:
    name: Add release notes to deploy tag
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/deploy-prod-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release on the deploy tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag pushed by user is the release marker. Add auto-generated
          # release notes (commits since previous deploy-prod-* tag).
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag -l 'deploy-prod-*' --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            NOTES_OPT="--generate-notes"
          else
            NOTES_OPT="--generate-notes --notes-start-tag $PREV_TAG"
          fi
          gh release create "$TAG" \
            --title "Production deploy: $TAG" \
            $NOTES_OPT

# Deploy on push to dev — calls the shared deploy.yml with dev-environment inputs.
#
# Per the cleanup plan (Phase 5 Day 4–6), this workflow goes live first
# (before the prod trigger) so the dev environment soaks the deploy chain
# for at least 5 days before main goes live.

name: deploy-dev

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

# Prevent two deploys to dev colliding (e.g., back-to-back pushes)
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      project-ref: zqlowjveyqiagnbmfwsb
      cloud-run-service: extraction-service-dev
      eas-channel: development
    # Map env-suffixed repo secrets to the generic names deploy.yml expects.
    # Repo has separate GCP_WIF_PROVIDER_DEV / _PROD pairs so dev and prod
    # CI flows assume their own deployer SAs (not a shared one).
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
      GCP_SA_EMAIL: ${{ secrets.GCP_SA_EMAIL_DEV }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SLACK_DEPLOYS_WEBHOOK: ${{ secrets.SLACK_DEPLOYS_WEBHOOK }}

# =============================================================================
# Flent Secured v2 - Backend CI/CD Pipeline
# =============================================================================
# Triggers: Pull requests to main branch affecting backend code
# Jobs: All tests run in single job to avoid credential-passing issues
#
# IMPORTANT: This pipeline runs tests only. Merging is always manual.
# =============================================================================

name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/**'
      - '.github/workflows/ci-backend.yml'

env:
  SUPABASE_PROJECT_ID: uowjtrzmszuaiokqxgir
  DENO_VERSION: v1.x
  # Use the existing v2-backend-dev Supabase branch for all tests
  SUPABASE_BRANCH_NAME: v2-backend-dev

jobs:
  # ===========================================================================
  # Run All Tests (single job to avoid credential-passing issues)
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Get Branch Credentials
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Get branch credentials using Supabase CLI
          BRANCH_CREDS=$(supabase branches get ${{ env.SUPABASE_BRANCH_NAME }} \
            --project-ref ${{ env.SUPABASE_PROJECT_ID }} \
            --output json 2>&1)

          # Check if command was successful
          if ! echo "$BRANCH_CREDS" | jq -e '.SUPABASE_URL' > /dev/null 2>&1; then
            echo "::error::Failed to get branch credentials. Output: $BRANCH_CREDS"
            exit 1
          fi

          # Extract and export credentials as environment variables for this job
          echo "SUPABASE_URL=$(echo "$BRANCH_CREDS" | jq -r '.SUPABASE_URL')" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$(echo "$BRANCH_CREDS" | jq -r '.SUPABASE_ANON_KEY')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$BRANCH_CREDS" | jq -r '.SUPABASE_SERVICE_ROLE_KEY')" >> $GITHUB_ENV

          # Use pooler URL - prepare=false is needed for supabase CLI but not for psql
          # Note: Direct/non-pooling URLs use IPv6 which is unreachable from GitHub Actions
          POOLER_URL=$(echo "$BRANCH_CREDS" | jq -r '.POSTGRES_URL // empty')

          if [ -n "$POOLER_URL" ]; then
            echo "Using pooler URL"
            # For psql commands (schema reset, seed, verify)
            echo "PSQL_DB_URL=${POOLER_URL}" >> $GITHUB_ENV
            # For supabase CLI commands (db push) - needs prepare=false to avoid conflicts
            echo "SUPABASE_DB_URL=${POOLER_URL}&prepare=false" >> $GITHUB_ENV
          else
            echo "::error::No database URL available"
            exit 1
          fi

          echo "Successfully retrieved branch credentials for ${{ env.SUPABASE_BRANCH_NAME }}"
          echo "Available fields in credentials:"
          echo "$BRANCH_CREDS" | jq -r 'keys[]'

      - name: Install PostgreSQL Client
        run: |
          if ! command -v psql &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi

      - name: Reset and Apply Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Resetting schema on branch ${{ env.SUPABASE_BRANCH_NAME }}..."

          # Clear migration history so Supabase CLI will re-apply all migrations
          # This is safe for a test branch - we always start fresh
          psql "$PSQL_DB_URL" -c "
            -- Drop existing public tables to start fresh (CI test branch only)
            -- Drop in reverse dependency order
            DROP TABLE IF EXISTS audit_logs CASCADE;
            DROP TABLE IF EXISTS cashback_ledger CASCADE;
            DROP TABLE IF EXISTS notifications CASCADE;
            DROP TABLE IF EXISTS notification_queue CASCADE;
            DROP TABLE IF EXISTS payments CASCADE;
            DROP TABLE IF EXISTS bank_accounts CASCADE;
            DROP TABLE IF EXISTS identity_verifications CASCADE;
            DROP TABLE IF EXISTS utility_verifications CASCADE;
            DROP TABLE IF EXISTS device_tokens CASCADE;
            DROP TABLE IF EXISTS idempotency_keys CASCADE;
            DROP TABLE IF EXISTS rental_parties CASCADE;
            DROP TABLE IF EXISTS extracted_rental_info CASCADE;
            DROP TABLE IF EXISTS tenancies CASCADE;
            DROP TABLE IF EXISTS users CASCADE;

            -- Clear migration history
            TRUNCATE supabase_migrations.schema_migrations;
          " 2>&1 || echo "Schema reset may have partially failed - continuing"

          # Wait for pooler connections to expire (prepared statements cache)
          echo "Waiting for pooler to release stale connections..."
          sleep 5

          # Clear any cached prepared statements
          psql "$PSQL_DB_URL" -c "DISCARD ALL;" 2>&1 || true

          echo "Applying migrations to branch..."
          # Retry logic for migration push (pooler can have transient issues)
          for attempt in 1 2 3; do
            echo "Migration attempt $attempt..."
            if supabase db push --db-url "$SUPABASE_DB_URL" 2>&1; then
              echo "Migrations applied successfully"
              break
            fi
            if [ $attempt -eq 3 ]; then
              echo "::error::Migration push failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $attempt failed, waiting before retry..."
            sleep 5
          done

          # Reload PostgREST schema cache to pick up new columns
          echo "Reloading schema cache..."
          psql "$PSQL_DB_URL" -c "NOTIFY pgrst, 'reload schema';" || {
            echo "::warning::Schema reload notification failed"
          }

          # Give PostgREST time to reload its schema cache
          sleep 10

          # Verify critical columns exist
          echo "Verifying schema..."
          psql "$PSQL_DB_URL" -c "SELECT column_name FROM information_schema.columns WHERE table_name = 'payments' AND column_name = 'due_date';" | grep due_date || {
            echo "::error::payments.due_date column not found after migration!"
            exit 1
          }
          echo "Schema verification passed"

      - name: Seed Test Data
        run: |
          echo "Seeding test data..."
          # Run seed.sql to create test fixtures required by tests
          # (psql was installed in the migrations step)
          psql "$PSQL_DB_URL" -f supabase/seed.sql 2>&1 || {
            echo "::warning::Seed may have partially failed - continuing anyway"
          }
          echo "Seed completed"

      - name: Configure Edge Function Secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # PayU sandbox test credentials - fallback to mock-payu.ts defaults for testing
          PAYU_MERCHANT_KEY: ${{ secrets.PAYU_SANDBOX_KEY || 'gtKFFx' }}
          PAYU_MERCHANT_SALT: ${{ secrets.PAYU_SANDBOX_SALT || 'eCwWELxi' }}
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_SANDBOX_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SANDBOX_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_CLUB_KEY: ${{ secrets.API_CLUB_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # Extract branch project ref from the URL
          BRANCH_REF=$(echo "$SUPABASE_URL" | sed 's|https://||' | sed 's|\.supabase\.co||')
          echo "Branch project ref: $BRANCH_REF"
          echo "BRANCH_REF=$BRANCH_REF" >> $GITHUB_ENV

          echo "Setting Edge Function secrets on branch (BEFORE deployment)..."
          supabase secrets set \
            PAYU_MERCHANT_KEY="$PAYU_MERCHANT_KEY" \
            PAYU_MERCHANT_SALT="$PAYU_MERCHANT_SALT" \
            CASHFREE_APP_ID="${CASHFREE_APP_ID:-test_id}" \
            CASHFREE_SECRET_KEY="${CASHFREE_SECRET_KEY:-test_secret}" \
            OPENAI_API_KEY="${OPENAI_API_KEY:-test_key}" \
            API_CLUB_KEY="${API_CLUB_KEY:-test_key}" \
            RESEND_API_KEY="${RESEND_API_KEY:-test_key}" \
            --project-ref "$BRANCH_REF" || {
              echo "::warning::Failed to set secrets - tests may fail"
            }

      - name: Deploy Edge Functions to Branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Deploying Edge Functions to branch..."
          # Deploy all functions (secrets are already set)
          supabase functions deploy --project-ref "$BRANCH_REF" || {
            echo "::warning::Function deployment failed - continuing with tests"
          }
        continue-on-error: true

      - name: Run Database Tests (pgTAP)
        run: |
          echo "Running pgTAP database tests..."
          echo "DB URL format: ${SUPABASE_DB_URL:0:50}..."
          supabase test db --db-url "$SUPABASE_DB_URL" || {
            echo "::warning::Database tests failed - may be connectivity issue from GitHub Actions"
            echo "Continuing with Edge Function tests..."
          }
        continue-on-error: true

      - name: Run Edge Function Tests
        env:
          # Must match secrets set on Supabase branch (use same fallbacks as mock-payu.ts)
          PAYU_MERCHANT_KEY: ${{ secrets.PAYU_SANDBOX_KEY || 'gtKFFx' }}
          PAYU_MERCHANT_SALT: ${{ secrets.PAYU_SANDBOX_SALT || 'eCwWELxi' }}
        run: |
          echo "Running Edge Function unit tests..."
          deno test supabase/functions/_tests/ \
            --allow-env \
            --allow-net \
            --allow-read

      - name: Check for Integration Tests
        id: check-integration
        run: |
          if [ -d "tests/sandbox" ] && [ -n "$(ls -A tests/sandbox/*.ts 2>/dev/null)" ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "No integration tests found in tests/sandbox/ - skipping"
          fi

      - name: Run Integration Tests
        if: steps.check-integration.outputs.has_tests == 'true'
        run: |
          echo "Running sandbox integration tests..."
          deno test tests/sandbox/ --allow-all
        env:
          # Must match secrets set on Supabase branch (use same fallbacks as mock-payu.ts)
          PAYU_MERCHANT_KEY: ${{ secrets.PAYU_SANDBOX_KEY || 'gtKFFx' }}
          PAYU_MERCHANT_SALT: ${{ secrets.PAYU_SANDBOX_SALT || 'eCwWELxi' }}
          PAYU_BASE_URL: https://sandboxsecure.payu.in
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_SANDBOX_ID || 'test_id' }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SANDBOX_SECRET || 'test_secret' }}
          CASHFREE_BASE_URL: https://sandbox.cashfree.com/verification

      - name: Generate Coverage Report
        env:
          PAYU_MERCHANT_KEY: ${{ secrets.PAYU_SANDBOX_KEY || 'gtKFFx' }}
          PAYU_MERCHANT_SALT: ${{ secrets.PAYU_SANDBOX_SALT || 'eCwWELxi' }}
        run: |
          deno test supabase/functions/_tests/ \
            --allow-env \
            --allow-net \
            --allow-read \
            --coverage=./coverage
          deno coverage ./coverage --lcov > coverage.lcov
        continue-on-error: true

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
          flags: edge-functions
        continue-on-error: true

  # ===========================================================================
  # Claude Code Review (generates missing tests and reviews changes)
  # ===========================================================================
  claude-review:
    name: Claude Code Review
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ## YOUR ROLE
            You are responsible for:
            1. Reviewing code changes in this PR
            2. Generating missing tests if coverage is insufficient
            3. Ensuring security best practices

            ## TASKS

            1. **Analyze Changed Files**
               - Review all files changed in this PR
               - Identify code paths without test coverage
               - Check for security issues (hardcoded secrets, SQL injection, etc.)

            2. **Generate Tests if Needed**
               - If Edge Functions lack tests, generate them in supabase/functions/_tests/
               - Payment functions MUST have 100% coverage
               - Use existing test helpers in supabase/functions/_tests/helpers/

            3. **Run Tests Locally**
               - Execute: deno test supabase/functions/_tests/ --allow-all
               - Verify tests pass before committing

            4. **Security Checklist**
               - [ ] No hardcoded secrets
               - [ ] PayU hash validation implemented
               - [ ] SQL injection prevention (parameterized queries)
               - [ ] Input validation on all endpoints
               - [ ] RLS policies for new tables

            5. **Post Review**
               - Comment on PR with findings
               - If tests were added, commit with message: "test: add tests for [function name]"

          claude_args: |
            --max-turns 15
            --allowedTools "Read,Write,Edit,Bash(deno test:*),Bash(git:*),Bash(gh pr comment:*)"

  # ===========================================================================
  # NOTE: No cleanup job needed - we use a persistent branch (v2-backend-dev)
  # NOTE: Merging to main is ALWAYS manual - this pipeline only runs tests
  # ===========================================================================

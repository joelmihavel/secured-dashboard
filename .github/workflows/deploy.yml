# Deploy — orchestrates Supabase + Cloud Run + EAS for one environment.
#
# Called by deploy-dev-trigger.yml (push to dev branch) and
# deploy-prod-trigger.yml (push to main, with approval gates).
# Single workflow keeps dev and prod from drifting apart.
#
# Per the cleanup plan (Phase 5 Day 5–7), this orchestrator runs the
# building blocks: _reusable-supabase, _reusable-cloud-run, _reusable-eas-update.
# Sequencing is important — migrations before functions before cloud-run
# before EAS, so each layer sees the previous layer's state.

name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "dev | prod"
        required: true
        type: string
      project-ref:
        description: "Supabase project ref"
        required: true
        type: string
      cloud-run-service:
        description: "Cloud Run service name"
        required: true
        type: string
      eas-channel:
        description: "EAS update channel"
        required: true
        type: string
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      GCP_WIF_PROVIDER:
        required: true
      GCP_SA_EMAIL:
        required: true
      EXPO_TOKEN:
        required: true
      SLACK_DEPLOYS_WEBHOOK:
        required: false

jobs:
  # ─── Detect what to deploy ───────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      migrations: ${{ steps.tag-defaults.outputs.migrations || steps.filter.outputs.migrations }}
      functions: ${{ steps.tag-defaults.outputs.functions || steps.filter.outputs.functions }}
      cloudrun: ${{ steps.tag-defaults.outputs.cloudrun || steps.filter.outputs.cloudrun }}
      rn: ${{ steps.tag-defaults.outputs.rn || steps.filter.outputs.rn }}
    steps:
      - uses: actions/checkout@v4
        with:
          # paths-filter needs prior commit available; default depth=1 doesn't
          # expose HEAD~1 / github.event.before. fetch-depth: 0 = full history.
          fetch-depth: 0

      # Tag pushes (deploy-prod-*) are explicit deploy decisions — paths-filter
      # has no useful comparison base for new tags (github.event.before is
      # 0000…, fallback to default_branch HEAD = same SHA as the tag → empty
      # diff → all jobs skipped). Caught 2026-05-01 on tag
      # deploy-prod-2026-05-01-status-trigger-fix where prod CI succeeded but
      # deployed nothing. Tags always run every layer; the tag IS the explicit
      # "ship it" signal, not a path-aware optimisation.
      - id: tag-defaults
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "migrations=true" >> "$GITHUB_OUTPUT"
          echo "functions=true" >> "$GITHUB_OUTPUT"
          echo "cloudrun=true" >> "$GITHUB_OUTPUT"
          echo "rn=true" >> "$GITHUB_OUTPUT"

      # Branch pushes (deploy-dev-trigger.yml on `dev`) keep paths-filter so
      # doc-only / unrelated-path commits don't redeploy every layer.
      - id: filter
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: dorny/paths-filter@v3
        with:
          # When deploy.yml is invoked via workflow_call (from
          # deploy-dev-trigger.yml / deploy-prod-trigger.yml), the
          # auto-detect-push logic in paths-filter doesn't fire and it
          # falls back to comparing origin/main...origin/<branch> against
          # the default branch. After `git push origin main:dev` those
          # refs are identical, so the filter saw zero changes and skipped
          # every downstream job (caught 2026-04-26 on commits 01c9e3be /
          # 5021a155). Pin base explicitly to the push event's `before`
          # SHA so the diff is always against the previous tip of the
          # branch we just pushed to. The `0000…` fallback handles the
          # very-first-push case where `before` is the null SHA.
          base: ${{ github.event.before == '0000000000000000000000000000000000000000' && github.event.repository.default_branch || github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            migrations:
              - 'supabase/migrations/**'
            functions:
              - 'supabase/functions/**'
            cloudrun:
              - 'cloud-run/extraction-service/**'
            rn:
              - 'rn-app/src/**'
              - 'rn-app/app/**'
              - 'rn-app/app.json'

  # ─── Migrations first (other layers depend on schema state) ─────────
  migrations:
    name: Migrations
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    uses: ./.github/workflows/_reusable-supabase.yml
    with:
      mode: db-push
      project-ref: ${{ inputs.project-ref }}
      environment: ${{ inputs.environment }}
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ─── Edge functions (after migrations) ───────────────────────────────
  functions:
    name: Edge functions
    needs: [changes, migrations]
    if: |
      always() &&
      needs.changes.outputs.functions == 'true' &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped')
    uses: ./.github/workflows/_reusable-supabase.yml
    with:
      mode: functions
      project-ref: ${{ inputs.project-ref }}
      environment: ${{ inputs.environment }}
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ─── Cloud Run extraction service ────────────────────────────────────
  cloud-run:
    name: Cloud Run
    needs: [changes, migrations, functions]
    if: |
      always() &&
      needs.changes.outputs.cloudrun == 'true' &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') &&
      (needs.functions.result == 'success' || needs.functions.result == 'skipped')
    uses: ./.github/workflows/_reusable-cloud-run.yml
    with:
      service: ${{ inputs.cloud-run-service }}
    secrets:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_SA_EMAIL: ${{ secrets.GCP_SA_EMAIL }}

  # ─── EAS update last (RN code change) ────────────────────────────────
  eas-update:
    name: EAS Update
    needs: [changes, migrations, functions, cloud-run]
    if: |
      always() &&
      needs.changes.outputs.rn == 'true' &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') &&
      (needs.functions.result == 'success' || needs.functions.result == 'skipped') &&
      (needs.cloud-run.result == 'success' || needs.cloud-run.result == 'skipped')
    uses: ./.github/workflows/_reusable-eas-update.yml
    with:
      channel: ${{ inputs.eas-channel }}
      message: ""  # auto from commit
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # ─── Notify ──────────────────────────────────────────────────────────
  notify:
    name: Notify
    needs: [migrations, functions, cloud-run, eas-update]
    if: always() && vars.SLACK_DEPLOYS_WEBHOOK_CONFIGURED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Build deploy summary
        id: summary
        run: |
          echo "msg<<EOF" >> $GITHUB_OUTPUT
          echo "DEPLOY ${{ inputs.environment }} ${{ job.status }}" >> $GITHUB_OUTPUT
          echo "sha: ${GITHUB_SHA:0:7} (${{ github.actor }})" >> $GITHUB_OUTPUT
          echo "changed: migrations=${{ needs.migrations.result }} functions=${{ needs.functions.result }} cloudrun=${{ needs.cloud-run.result }} eas=${{ needs.eas-update.result }}" >> $GITHUB_OUTPUT
          echo "logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
          echo "rollback: gh workflow run rollback.yml -f surface=cloud-run -f revision_or_sha=$(git rev-parse HEAD~1) -f confirm=ROLLBACK" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post to Slack
        if: always()
        env:
          MSG: ${{ steps.summary.outputs.msg }}
        run: |
          if [ -n "${{ secrets.SLACK_DEPLOYS_WEBHOOK }}" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "$(jq -nR --arg t "$MSG" '{text: $t}')" \
              "${{ secrets.SLACK_DEPLOYS_WEBHOOK }}"
          else
            echo "$MSG"
          fi

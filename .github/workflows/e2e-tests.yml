# =============================================================================
# Flent Secured v2 - E2E Test Pipeline
# =============================================================================
# Orchestrates the full testing pyramid: backend (Deno) + frontend (Jest) +
# E2E (Maestro Cloud). Supports smoke, regression, and nightly profiles.
#
# Triggers:
#   - Push to main           -> smoke tests (frontend + E2E P0)
#   - Pull request to main   -> smoke tests (backend + frontend + E2E P0)
#   - Nightly (2 AM IST)     -> full regression (all layers, all flows)
#   - Manual dispatch         -> configurable profile and layers
#
# IMPORTANT: This pipeline runs checks only. Merging is always manual.
# =============================================================================

name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'rn-app/**'
      - 'maestro/**'
      - 'supabase/functions/**'
      - '.github/workflows/e2e-tests.yml'

  pull_request:
    branches: [main]
    paths:
      - 'rn-app/**'
      - 'maestro/**'
      - 'supabase/functions/**'
      - '.github/workflows/e2e-tests.yml'

  schedule:
    # 2 AM IST = 8:30 PM UTC previous day
    - cron: '30 20 * * *'

  workflow_dispatch:
    inputs:
      profile:
        description: 'Test profile to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - nightly
      layers:
        description: 'Layers to run (comma-separated: backend,frontend,e2e)'
        required: false
        default: 'backend,frontend,e2e'
        type: string
      e2e_cloud:
        description: 'Run E2E on Maestro Cloud'
        required: false
        default: true
        type: boolean
      e2e_shard:
        description: 'Enable E2E test sharding'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  DENO_VERSION: v1.x
  EAS_PROJECT_ID: 76348d87-1f03-489a-a606-9d7bab4acd66

jobs:
  # ===========================================================================
  # Job 1: Determine test configuration based on trigger
  # ===========================================================================
  configure:
    name: Configure Test Run
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.config.outputs.profile }}
      run_backend: ${{ steps.config.outputs.run_backend }}
      run_frontend: ${{ steps.config.outputs.run_frontend }}
      run_e2e: ${{ steps.config.outputs.run_e2e }}
      e2e_cloud: ${{ steps.config.outputs.e2e_cloud }}
      e2e_shard: ${{ steps.config.outputs.e2e_shard }}
    steps:
      - name: Determine configuration
        id: config
        run: |
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "profile=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
            LAYERS="${{ github.event.inputs.layers }}"
            echo "run_backend=$(echo $LAYERS | grep -q 'backend' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "run_frontend=$(echo $LAYERS | grep -q 'frontend' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "run_e2e=$(echo $LAYERS | grep -q 'e2e' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "e2e_cloud=${{ github.event.inputs.e2e_cloud }}" >> $GITHUB_OUTPUT
            echo "e2e_shard=${{ github.event.inputs.e2e_shard }}" >> $GITHUB_OUTPUT

          elif [ "$EVENT" = "schedule" ]; then
            echo "profile=nightly" >> $GITHUB_OUTPUT
            echo "run_backend=true" >> $GITHUB_OUTPUT
            echo "run_frontend=true" >> $GITHUB_OUTPUT
            echo "run_e2e=true" >> $GITHUB_OUTPUT
            echo "e2e_cloud=true" >> $GITHUB_OUTPUT
            echo "e2e_shard=true" >> $GITHUB_OUTPUT

          elif [ "$EVENT" = "pull_request" ]; then
            echo "profile=smoke" >> $GITHUB_OUTPUT
            echo "run_backend=true" >> $GITHUB_OUTPUT
            echo "run_frontend=true" >> $GITHUB_OUTPUT
            echo "run_e2e=true" >> $GITHUB_OUTPUT
            echo "e2e_cloud=true" >> $GITHUB_OUTPUT
            echo "e2e_shard=false" >> $GITHUB_OUTPUT

          else
            # push to main
            echo "profile=smoke" >> $GITHUB_OUTPUT
            echo "run_backend=false" >> $GITHUB_OUTPUT
            echo "run_frontend=true" >> $GITHUB_OUTPUT
            echo "run_e2e=true" >> $GITHUB_OUTPUT
            echo "e2e_cloud=true" >> $GITHUB_OUTPUT
            echo "e2e_shard=false" >> $GITHUB_OUTPUT
          fi

      - name: Print configuration
        run: |
          echo "## E2E Test Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Profile | ${{ steps.config.outputs.profile }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ steps.config.outputs.run_backend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ steps.config.outputs.run_frontend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E | ${{ steps.config.outputs.run_e2e }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloud | ${{ steps.config.outputs.e2e_cloud }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shard | ${{ steps.config.outputs.e2e_shard }} |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 2: Backend Tests (Deno)
  # ===========================================================================
  backend:
    name: Backend Tests
    needs: configure
    if: needs.configure.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.tests.outputs.status }}
      total: ${{ steps.tests.outputs.total }}
      passed: ${{ steps.tests.outputs.passed }}
      failed: ${{ steps.tests.outputs.failed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Run Edge Function Tests
        id: tests
        env:
          PAYU_MERCHANT_KEY: ${{ secrets.PAYU_SANDBOX_KEY }}
          PAYU_MERCHANT_SALT: ${{ secrets.PAYU_SANDBOX_SALT }}
        run: |
          echo "Running Edge Function unit tests..."

          set +e
          OUTPUT=$(deno test supabase/functions/_tests/ \
            --allow-env \
            --allow-net \
            --allow-read 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$OUTPUT"

          # Parse test counts from Deno output
          TOTAL=$(echo "$OUTPUT" | grep -oE '[0-9]+ tests?' | head -1 | grep -oE '[0-9]+' || echo "0")
          PASSED=$(echo "$OUTPUT" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' || echo "0")
          FAILED=$(echo "$OUTPUT" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' || echo "0")

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -eq 0 ]; then
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Generate coverage
        if: needs.configure.outputs.profile != 'smoke'
        env:
          PAYU_MERCHANT_KEY: ${{ secrets.PAYU_SANDBOX_KEY }}
          PAYU_MERCHANT_SALT: ${{ secrets.PAYU_SANDBOX_SALT }}
        run: |
          deno test supabase/functions/_tests/ \
            --allow-env \
            --allow-net \
            --allow-read \
            --coverage=./coverage
          deno coverage ./coverage --lcov > backend-coverage.lcov
        continue-on-error: true

      - name: Upload backend coverage
        if: needs.configure.outputs.profile != 'smoke'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend-coverage.lcov
          retention-days: 7
        continue-on-error: true

  # ===========================================================================
  # Job 3: Frontend Tests (Jest)
  # ===========================================================================
  frontend:
    name: Frontend Tests
    needs: configure
    if: needs.configure.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.tests.outputs.status }}
      total: ${{ steps.summary.outputs.total }}
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      coverage_lines: ${{ steps.summary.outputs.lines }}
      coverage_branches: ${{ steps.summary.outputs.branches }}
    defaults:
      run:
        working-directory: rn-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: rn-app/package-lock.json

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: rn-app/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('rn-app/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run Jest tests
        id: tests
        run: |
          set +e
          npx jest --coverage --ci --forceExit --json --outputFile=jest-results.json 2>&1
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
            exit 1
          fi
        env:
          CI: true

      - name: Parse coverage summary
        id: summary
        if: always()
        run: |
          if [ -f jest-results.json ]; then
            TOTAL=$(node -e "const r=require('./jest-results.json');console.log(r.numTotalTests||0)")
            PASSED=$(node -e "const r=require('./jest-results.json');console.log(r.numPassedTests||0)")
            FAILED=$(node -e "const r=require('./jest-results.json');console.log(r.numFailedTests||0)")
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
          fi

          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.lines.pct)")
            BRANCHES=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.branches.pct)")
            echo "lines=$LINES" >> $GITHUB_OUTPUT
            echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: rn-app/coverage/
          retention-days: 14

  # ===========================================================================
  # Job 4: Build App for E2E
  # ===========================================================================
  build-app:
    name: Build App for E2E
    needs: configure
    if: needs.configure.outputs.run_e2e == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      app_path: ${{ steps.build.outputs.app_path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: rn-app/package-lock.json

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: rn-app/node_modules
          key: node-modules-macos-${{ hashFiles('rn-app/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        working-directory: rn-app
        run: npm ci

      - name: Setup Expo CLI
        run: npm install -g eas-cli expo-cli

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: rn-app/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('rn-app/ios/Podfile.lock') }}

      - name: Prebuild iOS
        working-directory: rn-app
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_DISABLE_AUTO_UPLOAD: "true"

      - name: Build iOS Simulator App
        id: build
        working-directory: rn-app
        run: |
          xcodebuild \
            -workspace ios/FlentSecured.xcworkspace \
            -scheme FlentSecured \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath ios/build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions || true

          APP_PATH="ios/build/Build/Products/Debug-iphonesimulator/FlentSecured.app"
          if [ -d "$APP_PATH" ]; then
            echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
            echo "Build successful: $APP_PATH"
          else
            echo "::error::Build output not found at $APP_PATH"
            find ios/build -name "*.app" -type d 2>/dev/null || echo "No .app found"
            exit 1
          fi

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: rn-app/ios/build/Build/Products/Debug-iphonesimulator/FlentSecured.app
          retention-days: 1

  # ===========================================================================
  # Job 5: E2E Tests (Maestro)
  # ===========================================================================
  e2e:
    name: E2E Tests (Maestro)
    needs: [configure, build-app]
    if: needs.configure.outputs.run_e2e == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.run-e2e.outputs.status }}
      total: ${{ steps.run-e2e.outputs.total }}
      passed: ${{ steps.run-e2e.outputs.passed }}
      failed: ${{ steps.run-e2e.outputs.failed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: app-build

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run E2E Tests
        id: run-e2e
        env:
          MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          APP_BINARY: app-build/FlentSecured.app
        run: |
          PROFILE="${{ needs.configure.outputs.profile }}"
          CLOUD="${{ needs.configure.outputs.e2e_cloud }}"
          SHARD="${{ needs.configure.outputs.e2e_shard }}"

          ARGS=("--profile" "$PROFILE")

          if [ "$CLOUD" = "true" ] && [ -n "$MAESTRO_CLOUD_API_KEY" ]; then
            # Cloud execution
            [ "$SHARD" = "true" ] && ARGS+=("--shard")
          else
            # Local execution (fallback if no cloud key)
            ARGS+=("--local")
          fi

          ARGS+=("--session-id" "gha-${{ github.run_id }}")

          set +e
          chmod +x maestro/run-cloud.sh
          ./maestro/run-cloud.sh "$APP_BINARY" "${ARGS[@]}" 2>&1
          EXIT_CODE=$?
          set -e

          # Parse results if available
          RESULTS_FILE=$(find maestro/artifacts -name "results.json" -type f 2>/dev/null | head -1)
          if [ -n "$RESULTS_FILE" ] && [ -f "$RESULTS_FILE" ]; then
            TOTAL=$(python3 -c "import json;d=json.load(open('$RESULTS_FILE'));print(d.get('total_flows',0))" 2>/dev/null || echo "0")
            PASSED=$(python3 -c "import json;d=json.load(open('$RESULTS_FILE'));print(d.get('passed',0))" 2>/dev/null || echo "0")
            FAILED=$(python3 -c "import json;d=json.load(open('$RESULTS_FILE'));print(d.get('failed',0))" 2>/dev/null || echo "0")
          else
            TOTAL="0"
            PASSED="0"
            FAILED="0"
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -eq 0 ]; then
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: maestro/artifacts/
          retention-days: 14

  # ===========================================================================
  # Job 6: Report Results
  # ===========================================================================
  report:
    name: Report Results
    needs: [configure, backend, frontend, e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Build summary
        id: summary
        run: |
          PROFILE="${{ needs.configure.outputs.profile }}"

          # Backend
          BE_STATUS="${{ needs.backend.outputs.status || 'skipped' }}"
          BE_TOTAL="${{ needs.backend.outputs.total || '0' }}"
          BE_PASSED="${{ needs.backend.outputs.passed || '0' }}"
          BE_FAILED="${{ needs.backend.outputs.failed || '0' }}"

          # Frontend
          FE_STATUS="${{ needs.frontend.outputs.status || 'skipped' }}"
          FE_TOTAL="${{ needs.frontend.outputs.total || '0' }}"
          FE_PASSED="${{ needs.frontend.outputs.passed || '0' }}"
          FE_FAILED="${{ needs.frontend.outputs.failed || '0' }}"
          FE_COV_LINES="${{ needs.frontend.outputs.coverage_lines || 'N/A' }}"
          FE_COV_BRANCHES="${{ needs.frontend.outputs.coverage_branches || 'N/A' }}"

          # E2E
          E2E_STATUS="${{ needs.e2e.outputs.status || 'skipped' }}"
          E2E_TOTAL="${{ needs.e2e.outputs.total || '0' }}"
          E2E_PASSED="${{ needs.e2e.outputs.passed || '0' }}"
          E2E_FAILED="${{ needs.e2e.outputs.failed || '0' }}"

          # Overall
          OVERALL="pass"
          if [ "$BE_STATUS" = "fail" ] || [ "$FE_STATUS" = "fail" ] || [ "$E2E_STATUS" = "fail" ]; then
            OVERALL="fail"
          fi

          echo "overall=$OVERALL" >> $GITHUB_OUTPUT

          # Write step summary
          echo "## E2E Test Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** $PROFILE | **Status:** $OVERALL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Layer | Status | Total | Passed | Failed |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|-------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | $BE_STATUS | $BE_TOTAL | $BE_PASSED | $BE_FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | $FE_STATUS | $FE_TOTAL | $FE_PASSED | $FE_FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E | $E2E_STATUS | $E2E_TOTAL | $E2E_PASSED | $E2E_FAILED |" >> $GITHUB_STEP_SUMMARY

          if [ "$FE_COV_LINES" != "N/A" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Frontend Coverage:** Lines ${FE_COV_LINES}% | Branches ${FE_COV_BRANCHES}%" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const overall = '${{ steps.summary.outputs.overall }}';
            const profile = '${{ needs.configure.outputs.profile }}';
            const icon = overall === 'pass' ? 'white_check_mark' : 'x';

            const body = [
              `## :${icon}: E2E Test Results`,
              '',
              `**Profile:** ${profile} | **Overall:** ${overall.toUpperCase()}`,
              '',
              '| Layer | Status | Passed | Failed |',
              '|-------|--------|--------|--------|',
              `| Backend | ${{ needs.backend.outputs.status || 'skipped' }} | ${{ needs.backend.outputs.passed || '-' }} | ${{ needs.backend.outputs.failed || '-' }} |`,
              `| Frontend | ${{ needs.frontend.outputs.status || 'skipped' }} | ${{ needs.frontend.outputs.passed || '-' }} | ${{ needs.frontend.outputs.failed || '-' }} |`,
              `| E2E | ${{ needs.e2e.outputs.status || 'skipped' }} | ${{ needs.e2e.outputs.passed || '-' }} | ${{ needs.e2e.outputs.failed || '-' }} |`,
              '',
              `> [View full workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`,
              '',
              `_Generated by [E2E Tests](.github/workflows/e2e-tests.yml) pipeline_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## :white_check_mark: E2E Test Results';
            const markerFail = '## :x: E2E Test Results';
            const existing = comments.find(c =>
              c.body && (c.body.startsWith(marker) || c.body.startsWith(markerFail))
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  # ===========================================================================
  # Job 7: Notify on Failure
  # ===========================================================================
  notify-failure:
    name: Notify on Failure
    needs: [configure, backend, frontend, e2e, report]
    if: >-
      always() &&
      (needs.backend.result == 'failure' ||
       needs.frontend.result == 'failure' ||
       needs.e2e.result == 'failure') &&
      (github.event_name == 'schedule' || needs.configure.outputs.profile == 'nightly')
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          PROFILE="${{ needs.configure.outputs.profile }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {\"type\": \"plain_text\", \"text\": \"Flent E2E: FAILED\"}
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*Profile:* ${PROFILE}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Trigger:* ${{ github.event_name }}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Backend:* ${{ needs.backend.outputs.status || 'skipped' }}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Frontend:* ${{ needs.frontend.outputs.status || 'skipped' }}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*E2E:* ${{ needs.e2e.outputs.status || 'skipped' }}\"}
                  ]
                },
                {
                  \"type\": \"section\",
                  \"text\": {\"type\": \"mrkdwn\", \"text\": \"<${RUN_URL}|View Workflow Run>\"}
                }
              ]
            }" || echo "Slack notification failed (non-blocking)"

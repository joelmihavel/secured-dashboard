# =============================================================================
# UI-040: Add Card Payment Method Flow
# Route: Modal overlay (AddCardContent in PaymentMethodModal)
# Figma: Add Card Payment
# testIDs: card-number-input, expiry-input, cvv-input, name-on-card-input,
#          modal-pay-card-button
# =============================================================================
#
# Validates:
#   - Card form renders with "Add your Credit Card" or "Debit Card" title
#   - Card number input field is visible (SecureCardInput)
#   - Expiry date input field is visible
#   - CVV input field is visible
#   - Name on card input field is visible
#   - Pay button is disabled until all fields are valid
#   - Footer text about verification message is visible
# =============================================================================

appId: com.flent.secured
---
# Navigate to enter-rent, enter amount, open modal, select Card setup
- launchApp:
    clearState: true
- openLink: "flentsecured:///payment/enter-rent"
- waitForAnimationToEnd

# Enter amount
- inputText: ${TEST_PAYMENT_AMOUNT}
- waitForAnimationToEnd

# Open method selector
- tapOn:
    id: "enter-rent-continue-button"
- waitForAnimationToEnd

# Wait for modal
- extendedWaitUntil:
    visible: "Payment Method"
    timeout: 5000

# Select Credit Card (may be disabled if landlord not approved)
# Fallback to Debit Card if Credit Card is disabled
- tapOn: "Debit Card"
- waitForAnimationToEnd
- tapOn:
    id: "modal-method-proceed-button"
- waitForAnimationToEnd

# -- Verify card form rendered --
- extendedWaitUntil:
    visible: "Add your"
    timeout: 5000

- assertVisible: "Add your"
- assertVisible: "Card"

# -- Verify SecureCardInput fields --
- assertVisible:
    id: "card-number-input"
- assertVisible:
    id: "expiry-input"
- assertVisible:
    id: "cvv-input"
- assertVisible:
    id: "name-on-card-input"

# -- Enter test card number --
- tapOn:
    id: "card-number-input"
- inputText: "4111111111111111"
- hideKeyboard

# -- Enter expiry date --
- tapOn:
    id: "expiry-input"
- inputText: "1228"
- hideKeyboard

# -- Enter CVV --
- tapOn:
    id: "cvv-input"
- inputText: "123"
- hideKeyboard

# -- Enter name on card --
- tapOn:
    id: "name-on-card-input"
- inputText: ${TEST_NAME}
- hideKeyboard

# -- Verify Pay button is present --
- assertVisible:
    id: "modal-pay-card-button"

# -- Verify footer text --
- assertVisible: "verification message"

- takeScreenshot: "add-card-completed"

# =============================================================================
# Payment: Add Netbanking Payment Method Flow
# Route: Modal overlay (AddNetbankingContent in PaymentMethodModal)
# Figma: Add Netbanking
# testIDs: bank-picker-trigger, bank-picker-search,
#          modal-proceed-netbanking-button
# =============================================================================
#
# Validates:
#   - Netbanking form renders with "Add your / Net Banking" title
#   - Popular Banks section visible with chip buttons
#   - "Select Bank" dropdown trigger is visible
#   - Tapping trigger opens bank picker modal with search
#   - Proceed button is visible
#   - Footer text about verification message is visible
# =============================================================================

appId: com.flent.secured
---
# Navigate to enter-rent, enter amount, open modal, select Netbanking
- launchApp:
    clearState: true
- openLink: "flentsecured:///payment/enter-rent"
- waitForAnimationToEnd

# Enter amount
- inputText: ${TEST_PAYMENT_AMOUNT}
- waitForAnimationToEnd

# Open method selector
- tapOn: "Select Payment Method"
- waitForAnimationToEnd

# Wait for modal
- extendedWaitUntil:
    visible: "Payment Method"
    timeout: 5000

# Select Net Banking
- tapOn: "Net Banking"
- waitForAnimationToEnd
- tapOn:
    id: "modal-method-proceed-button"
- waitForAnimationToEnd

# -- Verify netbanking form rendered --
- extendedWaitUntil:
    visible: "Net Banking"
    timeout: 5000

- assertVisible: "Add your"
- assertVisible: "Net Banking"

# -- Verify Popular Banks section --
- assertVisible:
    text: "Popular Banks"
    optional: true

# -- Verify Select Bank trigger --
- assertVisible:
    id: "bank-picker-trigger"
- assertVisible: "Select Bank"

# -- Test: Open bank picker modal --
- tapOn:
    id: "bank-picker-trigger"
- waitForAnimationToEnd

# -- Verify picker modal opened with search --
- extendedWaitUntil:
    visible:
      id: "bank-picker-search"
    timeout: 5000

# -- Test: Search for a bank --
- tapOn:
    id: "bank-picker-search"
- inputText: "HDFC"
- waitForAnimationToEnd

# -- Verify HDFC appears in filtered list --
- assertVisible:
    text: "HDFC"
    optional: true

# -- Close picker via Done button --
- tapOn: "Done"
- waitForAnimationToEnd

# -- Verify proceed button --
- assertVisible:
    id: "modal-proceed-netbanking-button"

# -- Verify footer text --
- assertVisible: "verification message"

- takeScreenshot: "add-netbanking-completed"

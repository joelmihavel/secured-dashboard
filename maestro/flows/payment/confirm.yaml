# =============================================================================
# Payment: Confirm (Transaction) Screen Functional Flow
# Route: /(payment)/confirm
# Figma: 799:3380
# testIDs: confirm-payment-screen
# =============================================================================
#
# Validates:
#   - Confirm payment screen renders with breakdown card
#   - "Rent due in" title is visible in top info card
#   - Cashback info text and pill are displayed
#   - Breakdown rows: Base rent, Total Rent, Convenience Fee
#   - Cashback row visible (locked or deducted)
#   - "Payable Amount" total row is visible
#   - "Pay ... now" CTA button with amount is visible
# =============================================================================

appId: com.flent.secured
---
# Deep link to confirm payment screen
- launchApp:
    clearState: true
- openLink: "flentsecured:///payment/confirm"
- waitForAnimationToEnd

# Verify screen rendered via testID
- assertVisible:
    id: "confirm-payment-screen"

# Verify top info card text
- assertVisible: "Rent due in"

# Verify cashback info
- assertVisible: "1% cashback"

# Verify cashback pill
- assertVisible: "cashback after payment"

# Verify breakdown rows
- assertVisible: "Base rent"

# Scroll to see full breakdown
- scrollUntilVisible:
    element: "Total Rent"
    direction: DOWN
    timeout: 5000

- assertVisible: "Total Rent"
- assertVisible: "Convenience Fee"

# Verify cashback row exists (either locked or unlocked)
- assertVisible: "Cashback"

# Verify payable amount total
- assertVisible: "Payable Amount"

# Verify Pay Now button is visible (text includes "Pay" and "now")
- assertVisible: "Pay"
- assertVisible: "now"

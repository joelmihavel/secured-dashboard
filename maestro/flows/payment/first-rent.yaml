# =============================================================================
# Payment: Enter Rent Screen Functional Flow
# Route: /(payment)/enter-rent
# Figma: 684:6018 / 684:6128 / 684:5915
# testIDs: enter-rent-screen, pay-now-button
# =============================================================================
#
# Validates:
#   - First rent payment screen renders with rent breakdown card
#   - Top card shows "Rent due in X days" heading
#   - Bottom card shows breakdown rows: Base rent, Maintenance, Other charges
#   - "Payable Rent" total row is visible
#   - Cashback waiting banner is displayed
#   - "Pay now" CTA button is visible and includes amount
#   - Footer text about completing setup is visible (unverified state)
# =============================================================================

appId: com.flent.secured
---
# Deep link to enter-rent payment screen
- launchApp:
    clearState: true
- openLink: "flentsecured:///payment/enter-rent"
- waitForAnimationToEnd

# Verify screen rendered via testID
- assertVisible:
    id: "enter-rent-screen"

# Verify top card content: "Rent due in" heading
- assertVisible: "Rent due in"

# Verify breakdown rows on the receipt card
- assertVisible: "Base rent"
- assertVisible: "Maintenance"
- assertVisible: "Other charges"

# Verify total payable row
- assertVisible: "Payable Rent"

# Verify cashback waiting banner
- assertVisible: "cashback waiting for you"

# Scroll down to the CTA
- scrollUntilVisible:
    element:
      id: "pay-now-button"
    direction: DOWN
    timeout: 5000

# Verify Pay Now button exists
- assertVisible:
    id: "pay-now-button"

# Verify footer text for unverified users
- assertVisible: "Complete setup to unlock cashback"

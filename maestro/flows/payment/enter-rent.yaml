# =============================================================================
# Payment: Enter Rent Amount Screen Functional Flow
# Route: /(payment)/enter-rent
# Figma: Enter Rent Amount (EnterAmountContent inside PaymentMethodModal)
# testIDs: enter-rent-screen
# =============================================================================
#
# The enter-rent screen is a thin wrapper that opens the PaymentMethodModal
# with initialView="enter-amount". The actual UI lives in EnterAmountContent.tsx.
#
# Validates:
#   - Enter rent screen renders with testID
#   - Month label (e.g. "FEBRUARY 2026 RENT") is displayed
#   - Due badge shows "DUE IN X DAYS" or "OVERDUE"
#   - Amount input area with rupee symbol and ".00" suffix is visible
#   - "Select Payment Method" CTA button is visible
#   - Entering a valid amount enables the button
# =============================================================================

appId: com.flent.secured
---
# Deep link to enter-rent screen
- launchApp:
    clearState: true
- openLink: "flentsecured:///payment/enter-rent"
- waitForAnimationToEnd

# -- Verify screen rendered --
- assertVisible:
    id: "enter-rent-screen"

# -- Verify amount display area --
- assertVisible: ".00"

# -- Verify CTA button --
- assertVisible: "Select Payment Method"

# -- Test: Enter a valid rent amount --
- inputText: "32500"
- waitForAnimationToEnd

# -- Verify CTA is still visible after entering amount --
- assertVisible: "Select Payment Method"

# -- Tap CTA to proceed to method selection --
- tapOn: "Select Payment Method"
- waitForAnimationToEnd

# -- Verify Payment Method selector appears --
- extendedWaitUntil:
    visible: "Payment Method"
    timeout: 5000
    optional: true

- takeScreenshot: "enter-rent-completed"

# =============================================================================
# Payment: Status Screen -- Refunded State
# Route: /(payment)/status?initialStatus=refunded
# Figma: 41-9635 (Refunded)
# testID: status-screen (SINGLE testID for all states)
# =============================================================================
#
# IMPORTANT: The status screen uses a SINGLE testID "status-screen" for ALL
# states. Assertions MUST use visible TEXT content, not state-specific testIDs.
#
# Validates:
#   - Status screen renders in refunded state
#   - Title shows "Payment" + "Refunded" text
#   - Info rows display refund messages
#   - "Try Again" button is visible
#   - "Contact Support" link text is visible
# =============================================================================

appId: com.flent.secured
---
# Deep link to status screen with refunded state
- launchApp:
    clearState: true
- openLink: "flentsecured:///payment/status?initialStatus=refunded"
- waitForAnimationToEnd

# Verify status screen rendered
- assertVisible:
    id: "status-screen"

# Verify refunded title text
- assertVisible: "Payment"
- assertVisible: "Refunded"

# Verify refund info messages
- assertVisible: "not completed"
- assertVisible: "returned to your account"

# Verify Try Again button
- assertVisible:
    id: "try-again-button"
- assertVisible: "Try Again"

# Verify Contact Support link text
- assertVisible: "Contact Support"

# =============================================================================
# TE-120: Profile Screen Functional Flow
# Route: /(profile)/index
# Figma: 41-8760
# testIDs: profile-screen, view-agreement-button, edit-bank-details-button,
#          edit-upi-button, edit-credit-card-button, edit-bank-account-button,
#          contact-support-button, rate-app-button, terms-conditions-button,
#          privacy-policy-button, sign-out-button, delete-account-button
# =============================================================================
#
# Validates:
#   - Profile screen renders with user info header
#   - "My Profile" title is visible
#   - Secured Account section: user info row, View Agreement button
#   - Payment Information section: Edit Bank Details (conditional)
#   - Support section: Contact Support, Rate the App
#   - App section: Terms & Conditions, Privacy Policy, Sign Out, Delete Account
#   - Tapping user info row navigates to edit profile
#   - Back navigation returns to profile
# =============================================================================

appId: com.flent.secured
---
# Deep link to profile screen
- launchApp:
    clearState: true
- openLink: "flentsecured:///profile/index"
- waitForAnimationToEnd

# Verify profile screen rendered
- assertVisible:
    id: "profile-screen"

# Verify profile title
- assertVisible: "Profile"

# Verify Secured Account section
- assertVisible: "Secured Account"

# Verify View Agreement menu item
- assertVisible:
    id: "view-agreement-button"

# Scroll to Support section
- scrollUntilVisible:
    element: "support"
    direction: DOWN
    timeout: 5000

# Verify Contact Support
- assertVisible:
    id: "contact-support-button"

# Verify Rate the App
- assertVisible:
    id: "rate-app-button"

# Scroll to App section
- scrollUntilVisible:
    element: "App"
    direction: DOWN
    timeout: 5000

# Verify Terms & Conditions
- scrollUntilVisible:
    element:
      id: "terms-conditions-button"
    direction: DOWN
    timeout: 5000

- assertVisible:
    id: "terms-conditions-button"

# Verify Privacy Policy
- assertVisible:
    id: "privacy-policy-button"

# Verify Sign Out
- scrollUntilVisible:
    element:
      id: "sign-out-button"
    direction: DOWN
    timeout: 5000

- assertVisible:
    id: "sign-out-button"

# Verify Delete Account
- scrollUntilVisible:
    element:
      id: "delete-account-button"
    direction: DOWN
    timeout: 5000

- assertVisible:
    id: "delete-account-button"

# -- Test navigation to View Agreement --
- scrollUntilVisible:
    element:
      id: "view-agreement-button"
    direction: UP
    timeout: 5000

- tapOn:
    id: "view-agreement-button"

- waitForAnimationToEnd

# Verify navigated to agreement screen
- assertVisible:
    id: "profile-agreement-screen"

# Go back to profile
- back
- waitForAnimationToEnd

# Verify we are back on profile
- assertVisible:
    id: "profile-screen"

- takeScreenshot: "profile-screen-complete"

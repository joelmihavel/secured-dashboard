# =============================================================================
# Journey: Crash Recovery During Payment
# EC-005
#
# Journey: initiate payment -> simulate app close -> reopen -> verify recovery
#
# This journey tests the app's resilience when the app is force-closed during
# an active payment flow. It verifies that:
#   - Payment state is persisted (Zustand persist middleware)
#   - Reopening the app recovers gracefully
#   - User can continue or see the result of the interrupted payment
#   - No duplicate payment is triggered
#
# Uses stopApp + launchApp (without clearState) to simulate crash/close.
#
# Prerequisites:
#   - User is authenticated
#   - Payment screen is reachable
# =============================================================================

appId: com.flent.secured
---
# =============================================
# STEP 1: Navigate to Payment Confirm
# =============================================
- launchApp:
    clearState: true

- openLink: "flentsecured:///payment/confirm"
- waitForAnimationToEnd

# Verify confirm screen loaded
- assertVisible:
    id: "confirm-payment-screen"

# =============================================
# STEP 2: Initiate Payment
# =============================================
# Scroll to Pay Now button
- scrollUntilVisible:
    element:
      id: "pay-now-button"
    direction: DOWN
    timeout: 5000

# Tap Pay Now to begin payment
- tapOn:
    id: "pay-now-button"
- waitForAnimationToEnd

# Brief wait to let payment initiation start
- wait: 2000

# =============================================
# STEP 3: Simulate App Close (NOT clearState)
# =============================================
# Stop the app without clearing state -- simulates force close or crash
- stopApp

# Brief pause simulating time with app closed
- wait: 2000

# =============================================
# STEP 4: Reopen App (State Should Be Preserved)
# =============================================
# Launch WITHOUT clearState to test state recovery
- launchApp
- waitForAnimationToEnd

# =============================================
# STEP 5: Verify Recovery
# =============================================
# The app should either:
# 1. Resume on the payment status screen (if payment was submitted)
# 2. Return to the last known screen (if payment was not yet submitted)
# 3. Show the home screen with the payment result available

# Check if we're on the status screen (payment completed before close)
- assertVisible:
    id: "status-screen"
    optional: true

# Check if we're on the confirm screen (payment not yet submitted)
- assertVisible:
    id: "confirm-payment-screen"
    optional: true

# Check if we're on the home screen (app restart default)
- assertVisible:
    id: "home-screen"
    optional: true

# =============================================
# STEP 6: Verify No Crash or Corrupt State
# =============================================
# Navigate to a known screen to confirm app stability
- openLink: "flentsecured:///main/index"
- waitForAnimationToEnd

- assertVisible:
    id: "home-screen"

# Navigate to profile to verify session is still active
- openLink: "flentsecured:///profile/index"
- waitForAnimationToEnd

- assertVisible:
    id: "profile-screen"

- takeScreenshot: "crash-recovery-payment-result"

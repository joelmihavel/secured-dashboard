# =============================================================================
# Journey: New User Onboarding E2E
#
# Full user journey: beta-splash -> splash -> carousel -> sign-up -> OTP ->
#                    agreement upload -> waitlist -> setup -> main
#
# This journey validates the complete onboarding path a new user takes
# from first app launch through authentication, onboarding, and reaching
# the home dashboard. It tests navigation continuity, state persistence
# across screens, and the auth/verification pipeline end-to-end.
#
# Prerequisites:
#   - App built with test/staging backend pointing to mock services
#   - TEST_PHONE, TEST_NAME, and TEST_OTP env vars set in config.yaml
#   - Mock backend configured to auto-approve waitlist for test numbers
# =============================================================================

appId: com.flent.secured
---
# =============================================
# STEP 1: Beta Splash (app entry point)
# =============================================
- launchApp:
    clearState: true

- waitForAnimationToEnd

# Verify beta-splash screen loads
- assertVisible:
    id: "beta-splash-screen"
- assertVisible: "BETA LAUNCH"

# Wait for auto-navigate to splash (2.5s timeout in source)
- extendedWaitUntil:
    visible:
      id: "splash-screen"
    timeout: 5000

# =============================================
# STEP 2: Splash Screen (Get Started)
# =============================================
- assertVisible:
    id: "splash-screen"
- assertVisible: "Get Started"

# Tap Get Started to enter carousel
- tapOn:
    id: "get-started-button"
- waitForAnimationToEnd

# =============================================
# STEP 3: Onboarding Carousel
# =============================================
- assertVisible:
    id: "carousel-screen"

# Verify first slide
- assertVisible: "Earn 1% back"

# Swipe through all 3 slides
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd

- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd

# On slide 3, verify content
- assertVisible: "benefits too"

# Tap Skip to proceed to sign-up
- tapOn: "Skip"
- waitForAnimationToEnd

# =============================================
# STEP 4: Sign-Up Screen
# =============================================
- assertVisible:
    id: "sign-up-screen"

# Enter phone number
- tapOn:
    id: "phone-input"
- inputText: ${TEST_PHONE}

# Enter name
- tapOn:
    id: "name-input"
- inputText: ${TEST_NAME}
- hideKeyboard

# Accept consent
- tapOn:
    id: "consent-toggle"

# Submit sign-up
- tapOn:
    id: "get-started-button"
- waitForAnimationToEnd

# =============================================
# STEP 5: OTP Verification
# =============================================
# OTP bottom sheet should appear
- assertVisible: "verify your number"

# Enter test OTP
- tapOn:
    id: "otp-input"
- inputText: ${TEST_OTP}
- waitForAnimationToEnd

# Tap Proceed to verify
- tapOn:
    id: "proceed-button"
- waitForAnimationToEnd

# Wait for auth completion and navigation (up to 10s for API calls)
- extendedWaitUntil:
    notVisible: "verify your number"
    timeout: 10000

# =============================================
# STEP 6: Agreement Upload
# =============================================
# After OTP, journey router resolves destination.
# For new users this should be agreement/upload.
# Use deep link as fallback if auto-routing hasn't fired.
- openLink: "flentsecured:///agreement/upload"
- waitForAnimationToEnd

- assertVisible:
    id: "upload-screen"
    optional: true
- assertVisible: "Upload"

# Tap proceed (mock backend accepts without file upload)
- tapOn:
    id: "proceed-button"
    optional: true
- waitForAnimationToEnd

# =============================================
# STEP 7: Agreement Review
# =============================================
- openLink: "flentsecured:///agreement/review?state=verify"
- waitForAnimationToEnd

- assertVisible:
    id: "review-screen"
    optional: true
- assertVisible: "Agreement"

# Scroll to confirmation
- scrollUntilVisible:
    element: "Confirm"
    direction: DOWN
    timeout: 10000
    optional: true

# =============================================
# STEP 8: Waitlist
# =============================================
# After agreement, user enters waitlist.
# Mock backend should auto-approve test phone numbers.
- openLink: "flentsecured:///waitlist/index?state=pending"
- waitForAnimationToEnd

- assertVisible: "Waitlist"

# Wait for mock approval redirect
- wait: 2000

# =============================================
# STEP 9: Setup Flow
# =============================================
- openLink: "flentsecured:///setup/index?step=1"
- waitForAnimationToEnd

- assertVisible:
    id: "setup-index-screen"
    optional: true

# Complete setup by tapping Start Flenting
- tapOn:
    id: "start-flenting-button"
    optional: true
- waitForAnimationToEnd

# =============================================
# STEP 10: Home Screen (Journey Complete)
# =============================================
- openLink: "flentsecured:///main/index"
- waitForAnimationToEnd

# Verify user has reached the home screen
- assertVisible:
    id: "home-screen"

# Take a screenshot for visual verification
- takeScreenshot: "onboarding-journey-complete"

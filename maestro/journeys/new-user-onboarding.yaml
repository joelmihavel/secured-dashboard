# =============================================================================
# TE-121: New User Onboarding E2E Journey
#
# Full user journey: Splash -> Carousel -> Sign-Up -> OTP -> Waitlist ->
#                    Agreement Upload -> Agreement Review -> Setup -> Home
#
# This journey validates the complete onboarding path a new user takes
# from first app launch to reaching the home screen. It tests navigation
# continuity, state persistence across screens, and the auth/verification
# pipeline end-to-end.
#
# Prerequisites:
#   - App built with test/staging backend pointing to mock services
#   - TEST_PHONE and TEST_OTP environment variables set in config.yaml
#   - Mock backend configured to auto-approve waitlist for test numbers
# =============================================================================

appId: com.flent.secured
---
# =============================================
# STEP 1: Splash Screen
# =============================================
- launchApp:
    clearState: true

- waitForAnimationToEnd

# Verify splash screen loads
- assertVisible:
    id: "splash-screen"
- assertVisible: "Get Started"

# Tap Get Started to enter carousel
- tapOn:
    id: "get-started-button"
- waitForAnimationToEnd

# =============================================
# STEP 2: Onboarding Carousel
# =============================================
- assertVisible:
    id: "carousel-screen"

# Swipe through all 3 carousel slides
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd

- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd

- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd

# After final slide, tap to proceed (or carousel auto-navigates)
# The carousel should end on a CTA or auto-proceed to sign-up

# =============================================
# STEP 3: Sign-Up Screen
# =============================================
# If not auto-navigated, deep link as fallback
- assertVisible:
    id: "sign-up-screen"
    optional: true

# Enter phone number
- tapOn:
    id: "phone-input"
- inputText: ${TEST_PHONE}

# Enter name
- tapOn:
    id: "name-input"
- inputText: ${TEST_NAME}
- hideKeyboard

# Accept consent
- tapOn:
    id: "consent-toggle"

# Submit sign-up
- tapOn:
    id: "get-started-button"
- waitForAnimationToEnd

# =============================================
# STEP 4: OTP Verification
# =============================================
# OTP bottom sheet should appear
- assertVisible: "verify your number"
- assertVisible: "Secure code"

# Enter test OTP
- tapOn:
    id: "otp-input"
- inputText: ${TEST_OTP}
- waitForAnimationToEnd

# Tap Proceed to verify
- tapOn:
    id: "proceed-button"
- waitForAnimationToEnd

# =============================================
# STEP 5: Waitlist Screen
# =============================================
# After successful OTP, user lands on waitlist
# Mock backend should auto-approve for test phone numbers
- assertVisible: "Waitlist"
    optional: true

# Wait for approval (mock backend should fast-track)
# In test mode, wait briefly then check for approval redirect
- waitForAnimationToEnd
- wait: 2000

# =============================================
# STEP 6: Agreement Upload
# =============================================
# After waitlist approval, navigate to agreement upload
# Use deep link if auto-navigation not triggered
- openLink: "flentsecured:///agreement/upload?state=idle"
- waitForAnimationToEnd

- assertVisible:
    id: "upload-screen"

# Verify upload zone
- assertVisible: "Upload"

# Tap proceed (skip actual file upload in E2E -- mock backend accepts)
- tapOn:
    id: "proceed-button"
    optional: true
- waitForAnimationToEnd

# =============================================
# STEP 7: Agreement Review
# =============================================
- openLink: "flentsecured:///agreement/review?state=verify"
- waitForAnimationToEnd

- assertVisible:
    id: "review-screen"
- assertVisible: "Agreement"

# Confirm agreement
- scrollUntilVisible:
    element: "Confirm"
    direction: DOWN
    timeout: 10000
    optional: true

# =============================================
# STEP 8: Setup Flow
# =============================================
- openLink: "flentsecured:///setup/index?step=1"
- waitForAnimationToEnd

- assertVisible:
    id: "setup-index-screen"

# Complete setup steps
- tapOn:
    id: "start-flenting-button"
- waitForAnimationToEnd

# =============================================
# STEP 9: Home Screen (Journey Complete)
# =============================================
- openLink: "flentsecured:///main/index"
- waitForAnimationToEnd

# Verify user has reached the home screen -- journey complete
- assertVisible:
    id: "home-screen"

# Take a screenshot for visual verification
- takeScreenshot: "onboarding-journey-complete"

# =============================================================================
# Journey: Make Payment E2E
#
# Full payment journey: enter-rent -> Pay Now -> (method modal) -> confirm ->
#                       Pay Now -> status (pending -> success)
#
# This journey validates the complete rent payment flow from the enter-rent
# breakdown screen through method selection, payment confirmation, and the
# status result screen.
#
# Prerequisites:
#   - User is already authenticated and has completed onboarding
#   - At least one payment method is configured (UPI, Card, or Netbanking)
#   - Mock backend returns successful payment for test flow
# =============================================================================

appId: com.flent.secured
---
# =============================================
# STEP 1: First Rent Screen (Payment Breakdown)
# =============================================
- launchApp:
    clearState: true

# Deep link to enter-rent screen
- openLink: "flentsecured:///payment/enter-rent"
- waitForAnimationToEnd

# Verify enter-rent screen loaded
- assertVisible:
    id: "enter-rent-screen"
    optional: true

# Verify key breakdown elements
- assertVisible: "Base rent"
- assertVisible: "Payable Rent"

# Scroll to and tap Pay Now
- scrollUntilVisible:
    element:
      id: "pay-now-button"
    direction: DOWN
    timeout: 5000

- tapOn:
    id: "pay-now-button"
- waitForAnimationToEnd

# =============================================
# STEP 2: Payment Method Selection Modal
# =============================================
# The PaymentMethodModal appears as an overlay.
# In test mode, a default method may be auto-selected.
# Wait briefly for modal animation, then proceed.
- wait: 1000
- waitForAnimationToEnd

# =============================================
# STEP 3: Confirm Payment Screen
# =============================================
# Navigate directly to confirm as fallback
- openLink: "flentsecured:///payment/confirm"
- waitForAnimationToEnd

# Verify confirm screen loaded
- assertVisible:
    id: "confirm-payment-screen"
    optional: true

# Verify breakdown elements
- assertVisible: "Total Rent"
- assertVisible: "Convenience Fee"
- assertVisible: "Payable Amount"

# Scroll to Pay Now button
- scrollUntilVisible:
    element:
      id: "pay-now-button"
    direction: DOWN
    timeout: 5000

# Tap Pay Now to initiate payment
- tapOn:
    id: "pay-now-button"
- waitForAnimationToEnd

# =============================================
# STEP 4: Payment Status -- Pending
# =============================================
# After tapping Pay Now on confirm, navigates to status screen
- extendedWaitUntil:
    visible:
      id: "status-screen"
    timeout: 5000

- assertVisible:
    id: "status-screen"

# Verify pending state initially shows "Verifying"
- assertVisible: "Verifying"

# Wait for mock backend to resolve payment (in dev mode: auto-success after delay)
# In production-like test: poll resolves within timeout
- wait: 5000
- waitForAnimationToEnd

# =============================================
# STEP 5: Payment Status -- Success (Expected)
# =============================================
# Verify success state if mock backend resolved
- assertVisible: "Succesful"
- assertVisible: "Amount paid"

# Verify Download Receipt button
- assertVisible:
    id: "download-receipt-button"
    optional: true

# Take screenshot of payment result
- takeScreenshot: "payment-journey-result"

# =============================================
# ALTERNATIVE PATH: Failed State
# =============================================
# Test the failed payment path separately via deep link
- openLink: "flentsecured:///payment/status?initialStatus=failed"
- waitForAnimationToEnd

- assertVisible:
    id: "status-screen"
- assertVisible: "Failed"

# Verify Contact Support button on failure
- assertVisible:
    id: "contact-support-button"
- assertVisible: "Contact Support"

# Verify Try Again link
- assertVisible: "Try Again"

- takeScreenshot: "payment-failed-state"

# =============================================
# ALTERNATIVE PATH: Refunded State
# =============================================
- openLink: "flentsecured:///payment/status?initialStatus=refunded"
- waitForAnimationToEnd

- assertVisible:
    id: "status-screen"
- assertVisible: "Refunded"

- takeScreenshot: "payment-refunded-state"
